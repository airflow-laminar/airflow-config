name: Build Status

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        airflow: ["2", "3", ""]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@c7ef9cbf13bc854a8d1422e9f8c6ee7a7ce1b911
        with:
          version: "3.11"

      - name: Setup Node.js
        uses: actions-ext/node/setup@8bcebee998923fcc26f5854b4fd05ea378b58262
        with:
          version: 22.x

      - name: Install dependencies
        run: make develop

      - name: Install Airflow 2.x
        run: uv pip install -e .[airflow]
        if: ${{ matrix.airflow == '2' }}

      - name: Install Airflow 3.x
        run: uv pip install -e .[airflow3]
        if: ${{ matrix.airflow == '3' }}

      - name: Lint
        run: make lint

      - name: Checks
        run: make checks

      - name: Build
        run: make build

      - name: Test
        run: make coverage

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results
          path: '**/junit.xml'
        if: matrix.airflow == '2'

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d  # v2.25.0
        with:
          files: '**/junit.xml'
        if: matrix.airflow == '2'

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.airflow == '2'

      - name: Build distributions
        run: make dist
        if: matrix.airflow == '2'

      - name: Test wheel
        uses: actions-ext/python/test-wheel@c7ef9cbf13bc854a8d1422e9f8c6ee7a7ce1b911
        with:
          module: airflow_config
        if: matrix.airflow == '2'

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@c7ef9cbf13bc854a8d1422e9f8c6ee7a7ce1b911
        with:
          module: airflow_config
        if: matrix.airflow == '2'

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist
        if: matrix.airflow == '2'
